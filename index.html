<body>

    <h1>Toy List</h1>
    <h2>Add Toy</h2>

    <form id="toyForm">
        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="text"
            id="price"
            placeholder="Price"
            required
        >
        <button type="submit">Add Toy</button>
    </form>
    <form id="toyFormDelete">
        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >
        <button type="submit">Delete Toy</button>
    </form>

    <p id="message"></p>

    <h2>Gundams</h2>

    <button id="loadToys">Load Gundam</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody id="toyTableBody">
        </tbody>
    </table>


    <script>
        const toyForm = document.getElementById("toyForm");
        const loadToyButton = document.getElementById("loadToys");
        const toyTableBody = document.getElementById("toyTableBody");
        const message = document.getElementById("message");


        // Load all Toys
        async function loadToys() {
            try {
                const response = await fetch("http://localhost:8000/api/toys");

                if (!response.ok) {
                    throw new Error("Failed to load toys");
                }

                const toy = await response.json();

                toyTableBody.innerHTML = "";

                toy.forEach(toy => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${toy.id}</td>
                        <td>${toy.name}</td>
                        <td>${toy.price}</td>
     
                    `;

                    toyTableBody.appendChild(row);
                });

            } catch (error) {
                console.error(error);
                message.textContent = "Failed to load toys.";
            }
        }


        // Add Toy
        toyForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const price = document.getElementById("price").value;

            try {
                const response = await fetch("http://localhost:8000/api/toys", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        price: price,
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to add toy");
                }

                message.textContent = "Toy added successfully";

                // Clear the form
                toyForm.reset();

                // Refresh movie list
                loadToys();

            } catch (error) {
                console.error(error);
                message.textContent = error.message;
            }
        });

        toyFormDelete.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementsById("name").value;
        })

        loadToyButton.addEventListener("click", loadToys);

    </script>

</body>
